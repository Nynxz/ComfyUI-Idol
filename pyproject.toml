[project]
name = "comfyui-idol"
version = "0.1.0"
description = "Native ComfyUI support for Idol, Speridlabs' single image to 3D gaussian splat model: converted weights for the stock loaders, plus its crop modes and predicted camera. No extra requirements."
authors = [{ name = "Nynxz", email = "contact@nynxz.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "Idol"

[tool.ruff]
target-version = "py310"
line-length = 130
